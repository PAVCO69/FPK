<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Музыка — ФПК МИИГАиК 1994</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #020b24;
      --card-bg: rgba(8, 25, 70, 0.3);
      --accent: #4da8da;
      --text: #e6f0ff;
      --muted: #b0c4de;
      --border: rgba(100, 160, 220, 0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.2rem;
      background-image: radial-gradient(circle at 60% 70%, #0a2a6a 0%, #020b24 70%);
      overflow-x: hidden;
    }
    .twinkle-star {
      position: fixed; border-radius: 50%; background: #fff;
      pointer-events: none; z-index: 1;
      animation: starTwinkle 2s infinite;
    }
    @keyframes starTwinkle { 0%,100%{opacity:0.2;} 50%{opacity:1; transform:scale(1.8);} }
    .satellite-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 4; overflow: hidden;
    }
    .satellite {
      position: absolute; font-size: 2rem; color: var(--accent);
      opacity: 0.8; animation: flySatellite linear infinite;
    }
    .satellite:nth-child(1) { top: 5%; animation-duration: 20s; font-size: 2.5rem; }
    .satellite:nth-child(2) { top: 25%; animation-duration: 25s; font-size: 2rem; }
    .satellite:nth-child(3) { top: 50%; animation-duration: 18s; font-size: 3rem; }
    .satellite:nth-child(4) { top: 70%; animation-duration: 22s; font-size: 1.8rem; }
    .satellite:nth-child(5) { top: 10%; animation-duration: 28s; font-size: 2.2rem; }
    .satellite:nth-child(6) { top: 40%; animation-duration: 15s; font-size: 1.9rem; }
    @keyframes flySatellite {
      0% { transform: translateX(-10vw) rotate(0deg); }
      100% { transform: translateX(110vw) rotate(360deg); }
    }
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      background: rgba(5, 18, 50, 0.55);
      backdrop-filter: blur(15px);
      border-radius: 2rem;
      padding: 0.8rem 1.2rem;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      position: relative;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .header-left { display: flex; flex-direction: column; align-items: flex-start; }
    .logo {
      font-weight: 700; font-size: 1.4rem;
      background: linear-gradient(135deg, #c2e2ff, #4da8da);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .header-subtitle { font-size: 0.7rem; color: var(--muted); }
    .menu-toggle {
      display: none; background: rgba(30, 60, 120, 0.7);
      border: 1px solid rgba(100, 160, 220, 0.6);
      color: #fff; font-size: 1.4rem; padding: 0.4rem 0.8rem;
      border-radius: 0.6rem; cursor: pointer;
    }
    nav { display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; }
    nav a {
      color: #fff; text-decoration: none; font-weight: 500;
      padding: 0.35rem 0.8rem; border-radius: 1.2rem;
      font-size: 0.85rem; display: inline-flex;
      align-items: center; gap: 0.3rem;
    }
    nav a i { color: var(--accent); }
    nav a:hover { background: rgba(77, 168, 218, 0.3); }
    nav a.active { background: var(--accent); color: #021024; }
    nav a.active i { color: #021024; }
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      nav {
        display: none; position: absolute; top: 100%; right: 0;
        flex-direction: column; gap: 0.5rem; padding: 1rem;
        background: rgba(3, 12, 38, 0.98);
        border-radius: 1rem; min-width: 240px;
        z-index: 1000; margin-top: 0.5rem;
      }
      nav.show { display: flex; }
      nav a { padding: 0.8rem 1.1rem; font-size: 1.05rem; background: rgba(15, 40, 90, 0.7); }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(100, 160, 220, 0.2);
      border-radius: 1.2rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(4px);
    }
    .loop-option {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: #fff;
      background: rgba(15, 40, 90, 0.6);
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      border: 1px solid var(--border);
      width: fit-content;
      user-select: none;
    }
    .loop-option input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
      margin: 0;
    }
    .album-selector {
      position: relative;
      margin-bottom: 1rem;
      max-width: 400px;
    }
    .album-selector select {
      width: 100%;
      padding: 0.7rem 2.5rem 0.7rem 1rem;
      border-radius: 0.8rem;
      background: rgba(15, 40, 90, 0.8);
      color: #fff;
      border: 1px solid var(--border);
      font-size: 1rem;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .album-selector::after {
      content: '▼';
      position: absolute;
      right: 15px;
      bottom: 12px;
      color: var(--accent);
      pointer-events: none;
      font-size: 0.7rem;
    }
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .song-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(13, 35, 80, 0.5);
      border-radius: 0.8rem;
      padding: 0.6rem 1rem;
      border: 1px solid #2a4a7a;
      cursor: pointer;
      transition: 0.3s;
    }
    .song-item:hover { border-color: var(--accent); }
    .song-item.active {
      background: rgba(77, 168, 218, 0.25);
      border-color: var(--accent);
    }
    .song-icon {
      font-size: 1.2rem;
      color: var(--accent);
      width: 30px;
      flex-shrink: 0;
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title { font-weight: 600; color: #fff; font-size: 0.9rem; }
    .song-artist { font-size: 0.75rem; color: var(--muted); }
    .inline-player {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .inline-player audio {
      width: 180px;
      height: 35px;
      display: block;
    }
    .stop-btn {
      background: rgba(30, 60, 120, 0.7);
      border: 1px solid rgba(100, 160, 220, 0.6);
      color: #fff;
      font-size: 0.9rem;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop-btn:hover { background: #e04e1d; border-color: #e04e1d; }

    /* Кнопка "Вверх" */
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(77, 168, 218, 0.8);
      color: #fff;
      border: 1px solid var(--accent);
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .scroll-top-btn:hover {
      background: var(--accent);
      transform: translateY(-3px);
    }
    .scroll-top-btn.visible {
      display: flex;
    }
    footer {
      text-align: center; margin-top: 2rem; color: var(--muted);
      font-size: 0.85rem; border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    @media (max-width: 600px) {
      .song-item { flex-wrap: wrap; gap: 0.5rem; }
      .song-info { flex: 1; min-width: calc(100% - 70px); }
      .inline-player { width: 100%; order: 3; }
      .inline-player audio { width: 100%; height: 40px; }
      .stop-btn { order: 2; }
      .loop-option { width: 100%; }
      .scroll-top-btn { bottom: 20px; right: 20px; width: 45px; height: 45px; }
    }
  </style>
</head>
<body>

<div class="satellite-container">
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
</div>

<div class="container">
  <header>
    <div class="header-left">
      <span class="logo"><i class="fas fa-satellite"></i> ФПК МИИГАиК · 1994</span>
      <span class="header-subtitle">Неофициальный сайт выпуска ФПК 1994</span>
    </div>
    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
    <nav id="navMenu">      <a href="index.html"><i class="fas fa-users"></i> О нас</a>
      <a href="events.html"><i class="fas fa-calendar-alt"></i> Мероприятия</a>
      <a href="photos.html"><i class="fas fa-camera"></i> Фото</a>
      <a href="videos.html"><i class="fas fa-video"></i> Видео</a>
      <a href="screenshots.html"><i class="fas fa-desktop"></i> Обои</a>
      <a href="music.html" class="active"><i class="fas fa-music"></i> Музыка</a>
</nav>
  </header>

  <main>
    <div class="card">
      <h1><i class="fas fa-music" style="color:var(--accent);"></i> Музыка</h1>
      <label class="loop-option">
        <input type="checkbox" id="loopToggle" checked>
        <span>🔁 Зациклить воспроизведение</span>
      </label>
      <div class="album-selector">
        <select id="playlistSelect" onchange="switchPlaylist(this.value)"></select>
      </div>
      <div class="song-list" id="songList"></div>
    </div>
  </main>
  <footer>© Выпускники ФПК МИИГАиК 1994 · Космос навсегда ·</footer>
</div>

<!-- Кнопка "Вверх" -->
<button class="scroll-top-btn" id="scrollTopBtn" title="Наверх">
  <i class="fas fa-chevron-up"></i>
</button>

<script>
  const playlists = [    {
      name: 'Все',
      songs: [
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/default.mp3', title: 'Мы', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Dozhd.mp3', title: 'Дождь', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Geodeziya.mp3', title: 'Геодезия', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Zerkalo.mp3', title: 'Зеркало', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/5_voprosov.mp3', title: '5 вопросов', artist: 'ВИА Спутник' }
      ]
    }
    ,
    {
      name: 'Альбом 30 лет спустя',
      songs: [
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/default.mp3', title: 'Мы', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Dozhd.mp3', title: 'Дождь', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Geodeziya.mp3', title: 'Геодезия', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Zerkalo.mp3', title: 'Зеркало', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/5_voprosov.mp3', title: '5 вопросов', artist: 'ВИА Спутник' }
      ]
    }
];
  let currentPlaylist = 0;
  let currentSongs = [];
  let currentAudio = null;
  let currentIndex = -1;
  const loopToggle = document.getElementById('loopToggle');
  const scrollTopBtn = document.getElementById('scrollTopBtn');

  // Звёзды
  function createStars() {
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'twinkle-star';
      const size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 5 + 's';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      document.body.appendChild(star);
    }
  }

  // Кнопка "Вверх" — показ/скрытие и действие
  window.addEventListener('scroll', () => {
    if (window.scrollY > 200) {
      scrollTopBtn.classList.add('visible');
    } else {
      scrollTopBtn.classList.remove('visible');
    }
  });

  scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function buildSelect() {
    const select = document.getElementById('playlistSelect');
    select.innerHTML = '';
    playlists.forEach((pl, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = pl.name;
      select.appendChild(opt);
    });
  }

  function switchPlaylist(index) {
    currentPlaylist = parseInt(index);
    stopAllAudio();
    buildSongList();
  }

  function stopAllAudio() {
    document.querySelectorAll('audio').forEach(a => { a.pause(); a.currentTime = 0; });
    document.querySelectorAll('.song-item').forEach(i => i.classList.remove('active'));
    currentAudio = null;
    currentIndex = -1;
  }

  function playSong(index) {
    const audioElements = document.querySelectorAll('.inline-player audio');
    const songItems = document.querySelectorAll('.song-item');
    if (currentAudio && currentAudio !== audioElements[index]) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    const audio = audioElements[index];
    audio.play();
    currentAudio = audio;
    currentIndex = index;
    songItems.forEach((item, i) => {
      item.classList.toggle('active', i === index);
    });
  }

  function stopSong(index) {
    const audioElements = document.querySelectorAll('.inline-player audio');
    const audio = audioElements[index];
    audio.pause();
    audio.currentTime = 0;
    document.querySelectorAll('.song-item')[index].classList.remove('active');
    if (currentAudio === audio) { currentAudio = null; currentIndex = -1; }
  }

  function buildSongList() {
    const list = document.getElementById('songList');
    list.innerHTML = '';
    currentSongs = playlists[currentPlaylist].songs;
    currentSongs.forEach((song, index) => {
      const div = document.createElement('div');
      div.className = 'song-item';
      div.innerHTML = `
        <div class="song-icon"><i class="fas fa-music"></i></div>
        <div class="song-info">
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        </div>
        <div class="inline-player">
          <audio src="${song.src}" preload="none" controls></audio>
        </div>
        <button class="stop-btn" title="Стоп"><i class="fas fa-stop"></i></button>
      `;
      const audio = div.querySelector('audio');
      const stopBtn = div.querySelector('.stop-btn');
      div.addEventListener('click', (e) => {
        if (e.target.closest('.inline-player') || e.target.closest('.stop-btn')) return;
        playSong(index);
      });
      stopBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        stopSong(index);
      });
      audio.addEventListener('ended', () => {
        div.classList.remove('active');
        if (loopToggle.checked) {
          const nextIndex = (index + 1) % currentSongs.length;
          playSong(nextIndex);
        } else {
          if (currentAudio === audio) { currentAudio = null; currentIndex = -1; }
        }
      });
      audio.addEventListener('play', () => {
        div.classList.add('active');
        if (currentAudio && currentAudio !== audio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        currentAudio = audio;
        currentIndex = index;
      });
      audio.addEventListener('pause', () => { div.classList.remove('active'); });
      list.appendChild(div);
    });
  }

  const toggle = document.getElementById('menuToggle');
  const nav = document.getElementById('navMenu');
  toggle.addEventListener('click', (e) => { e.stopPropagation(); nav.classList.toggle('show'); });

  buildSelect();
  buildSongList();
  createStars();
</script>
</body>
</html>
