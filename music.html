<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Музыка — ФПК МИИГАиК 1994</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root { --bg:#020b24; --card-bg:rgba(8,25,70,0.3); --accent:#4da8da; --text:#e6f0ff; --muted:#b0c4de; --border:rgba(100,160,220,0.25); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:1.2rem; background-image:radial-gradient(circle at 60% 70%, #0a2a6a, #020b24 70%); overflow-x:hidden; }
    .twinkle-star { position:fixed; border-radius:50%; background:#fff; pointer-events:none; z-index:1; animation:tw 2s infinite; }
    @keyframes tw { 0%,100%{opacity:0.2;} 50%{opacity:1; transform:scale(1.8);} }
    .satellite-container { position:fixed; inset:0; z-index:4; pointer-events:none; }
    .satellite { position:absolute; color:var(--accent); font-size:2rem; animation:fs linear infinite; }
    .satellite:nth-child(1){top:5%; animation-duration:20s; font-size:2.5rem;}
    .satellite:nth-child(2){top:25%; animation-duration:25s; font-size:2rem;}
    .satellite:nth-child(3){top:50%; animation-duration:18s; font-size:3rem;}
    .satellite:nth-child(4){top:70%; animation-duration:22s; font-size:1.8rem;}
    .satellite:nth-child(5){top:10%; animation-duration:28s; font-size:2.2rem;}
    .satellite:nth-child(6){top:40%; animation-duration:15s; font-size:1.9rem;}
    @keyframes fs { 100%{transform:translateX(110vw);} }
    .container { position:relative; z-index:2; max-width:1100px; margin:0 auto; width:100%; }
    header { background:rgba(5,18,50,0.55); backdrop-filter:blur(15px); border-radius:2rem; padding:0.8rem 1.2rem; border:1px solid var(--border); margin-bottom:1rem; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:0.5rem; position:relative; z-index:100; }
    .logo { font-weight:700; font-size:1.4rem; background:linear-gradient(#c2e2ff,#4da8da); -webkit-background-clip:text; color:transparent; }
    .header-subtitle { font-size:0.7rem; color:var(--muted); }
    .menu-toggle { display:none; background:rgba(30,60,120,0.7); border:1px solid rgba(100,160,220,0.6); color:#fff; font-size:1.4rem; padding:0.4rem 0.8rem; border-radius:0.6rem; cursor:pointer; }
    nav { display:flex; flex-wrap:wrap; gap:0.5rem; }
    nav a { color:#fff; text-decoration:none; padding:0.35rem 0.8rem; border-radius:1.2rem; font-size:0.85rem; display:inline-flex; align-items:center; gap:0.3rem; }
    nav a i { color:var(--accent); }
    nav a.active { background:var(--accent); color:#021024; }
    nav a.active i { color:#021024; }
    @media(max-width:768px){ .menu-toggle{display:block;} nav{display:none; position:absolute; top:100%; right:0; flex-direction:column; background:rgba(3,12,38,0.98); border-radius:1rem; padding:1rem; min-width:240px; z-index:1000;} nav.show{display:flex;} }
    .card { background:var(--card-bg); border:1px solid rgba(100,160,220,0.2); border-radius:1.2rem; padding:1.5rem; backdrop-filter:blur(4px); }
    .album-selector { position:relative; margin-bottom:1rem; max-width:400px; }
    .album-selector select { width:100%; padding:0.7rem 2.5rem 0.7rem 1rem; border-radius:0.8rem; background:rgba(15,40,90,0.8); color:#fff; border:1px solid var(--border); font-size:1rem; cursor:pointer; appearance:none; }
    .album-selector::after { content:'▼'; position:absolute; right:15px; bottom:12px; color:var(--accent); pointer-events:none; font-size:0.7rem; }
    .song-list { display:flex; flex-direction:column; gap:0.5rem; }
    .song-item { display:flex; align-items:center; gap:1rem; background:rgba(13,35,80,0.5); border-radius:0.8rem; padding:0.8rem 1.2rem; border:1px solid #2a4a7a; cursor:pointer; }
    .song-item:hover { border-color:var(--accent); }
    .song-item.active { background:rgba(77,168,218,0.2); border-color:var(--accent); }
    .song-icon { font-size:1.5rem; color:var(--accent); }
    .song-info { flex:1; }
    .song-title { font-weight:600; color:#fff; }
    .song-artist { font-size:0.8rem; color:var(--muted); }
    .player { background:rgba(13,35,80,0.8); border-radius:1rem; padding:1rem; margin-top:1rem; border:1px solid var(--accent); }
    .player-info { display:flex; align-items:center; gap:1rem; margin-bottom:0.5rem; }
    .player-icon { font-size:2rem; color:var(--accent); }
    .player-title { font-weight:600; color:#fff; }
    .player-controls { display:flex; align-items:center; gap:1rem; }
    .player-btn { background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; }
    .progress-bar { flex:1; height:6px; background:#3a3a3a; border-radius:3px; cursor:pointer; }
    .progress-fill { height:100%; background:var(--accent); width:0%; }
    h1 { color:#fff; }
    footer { text-align:center; margin-top:2rem; color:var(--muted); font-size:0.85rem; }
  </style>
</head>
<body>

<div class="satellite-container">
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
</div>

<div class="container">
  <header>
    <div class="header-left">
      <span class="logo"><i class="fas fa-satellite"></i> ФПК МИИГАиК · 1994</span>
      <span class="header-subtitle">Неофициальный сайт выпуска ФПК 1994</span>
    </div>
    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
    <nav id="navMenu">      <a href="index.html"><i class="fas fa-users"></i> О нас</a>
      <a href="events.html"><i class="fas fa-calendar-alt"></i> Мероприятия</a>
      <a href="photos.html"><i class="fas fa-camera"></i> Фото</a>
      <a href="videos.html"><i class="fas fa-video"></i> Видео</a>
      <a href="screenshots.html"><i class="fas fa-desktop"></i> Обои</a>
      <a href="music.html" class="active"><i class="fas fa-music"></i> Музыка</a>
</nav>
  </header>

  <main>
    <div class="card">
      <h1><i class="fas fa-music" style="color:var(--accent);"></i> Музыка</h1>
      <div class="album-selector">
        <select id="playlistSelect" onchange="switchPlaylist(this.value)"></select>
      </div>
      <div class="song-list" id="songList"></div>
      <div class="player" id="player" style="display:none;">
        <div class="player-info">
          <div class="player-icon"><i class="fas fa-compact-disc"></i></div>
          <div><div class="player-title" id="playerTitle">—</div><div class="song-artist" id="playerArtist">—</div></div>
        </div>
        <div class="player-controls">
          <button class="player-btn" onclick="prevSong()"><i class="fas fa-backward"></i></button>
          <button class="player-btn" id="playBtn" onclick="togglePlay()"><i class="fas fa-play-circle"></i></button>
          <button class="player-btn" onclick="nextSong()"><i class="fas fa-forward"></i></button>
          <div class="progress-bar" onclick="seekAudio(event)"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>
    </div>
  </main>
  
  <footer>© Выпускники ФПК МИИГАиК 1994 · Космос навсегда ·</footer>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
  const playlists = [    {
      name: 'Все',
      songs: [
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/default.mp3', title: 'Мы', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Dozhd.mp3', title: 'Дождь', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Geodeziya.mp3', title: 'Геодезия', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Zerkalo.mp3', title: 'Зеркало', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/default.mp3', title: 'Мы', artist: 'ВИА Спутник' }
      ]
    }
    ,
    {
      name: 'Альбом 30 лет спустя',
      songs: [
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/default.mp3', title: 'Мы', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Dozhd.mp3', title: 'Дождь', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Geodeziya.mp3', title: 'Геодезия', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/Zerkalo.mp3', title: 'Зеркало', artist: 'ВИА Спутник' }
        ,
        { src: 'https://github.com/PAVCO69/FPK/releases/download/SPACE_MUSIC/default.mp3', title: 'Мы', artist: 'ВИА Спутник' }
      ]
    }
];
  let currentPlaylist = 0;
  let currentSongs = [];
  let currentSongIndex = 0;
  let isPlaying = false;
  
  const audio = document.getElementById('audioPlayer');
  const player = document.getElementById('player');
  const playerTitle = document.getElementById('playerTitle');
  const playerArtist = document.getElementById('playerArtist');
  const playBtn = document.getElementById('playBtn');
  const progressFill = document.getElementById('progressFill');
  
  function buildSelect() {
    const select = document.getElementById('playlistSelect');
    select.innerHTML = '';
    playlists.forEach((pl, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = pl.name;
      select.appendChild(opt);
    });
  }
  
  function switchPlaylist(index) {
    currentPlaylist = parseInt(index);
    buildSongList();
  }
  
  function buildSongList() {
    const list = document.getElementById('songList');
    list.innerHTML = '';
    currentSongs = playlists[currentPlaylist].songs;
    currentSongs.forEach((song, index) => {
      const div = document.createElement('div');
      div.className = 'song-item';
      div.innerHTML = `<div class="song-icon"><i class="fas fa-music"></i></div><div class="song-info"><div class="song-title">${song.title}</div><div class="song-artist">${song.artist}</div></div>`;
      div.onclick = () => playSong(index);
      list.appendChild(div);
    });
  }
  
  function playSong(index) {
    currentSongIndex = index;
    const song = currentSongs[index];
    audio.src = song.src;
    audio.load();
    audio.play().then(() => {
      isPlaying = true;
      player.style.display = 'block';
      playerTitle.textContent = song.title;
      playerArtist.textContent = song.artist;
      playBtn.innerHTML = '<i class="fas fa-pause-circle"></i>';
      document.querySelectorAll('.song-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
    }).catch(err => {
      alert('Не удалось воспроизвести: ' + song.src);
    });
  }
  
  function togglePlay() {
    if (isPlaying) { audio.pause(); isPlaying = false; playBtn.innerHTML = '<i class="fas fa-play-circle"></i>'; }
    else { audio.play(); isPlaying = true; playBtn.innerHTML = '<i class="fas fa-pause-circle"></i>'; }
  }
  
  function nextSong() { currentSongIndex = (currentSongIndex + 1) % currentSongs.length; playSong(currentSongIndex); }
  function prevSong() { currentSongIndex = (currentSongIndex - 1 + currentSongs.length) % currentSongs.length; playSong(currentSongIndex); }
  function seekAudio(e) { const rect = e.target.getBoundingClientRect(); audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration; }
  
  audio.addEventListener('timeupdate', () => { progressFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%'; });
  audio.addEventListener('ended', nextSong);
  
  const toggle = document.getElementById('menuToggle');
  const nav = document.getElementById('navMenu');
  toggle.addEventListener('click', (e) => { e.stopPropagation(); nav.classList.toggle('show'); });
  
  buildSelect();
  buildSongList();
</script>
</body>
</html>
