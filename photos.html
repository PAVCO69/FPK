<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фото — ФПК МИИГАиК 1994</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #020b24;
      --card-bg: rgba(8, 25, 70, 0.3);
      --accent: #4da8da;
      --text: #e6f0ff;
      --muted: #b0c4de;
      --border: rgba(100, 160, 220, 0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.2rem;
      background-image: radial-gradient(circle at 30% 60%, #0a2a6a 0%, #020b24 70%);
      overflow-x: hidden;
    }
    .twinkle-star {
      position: fixed; border-radius: 50%; background: #fff;
      pointer-events: none; z-index: 1;
      animation: starTwinkle 2s infinite;
    }
    @keyframes starTwinkle { 0%,100%{opacity:0.2;} 50%{opacity:1; transform:scale(1.8);} }
    .satellite-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 4; overflow: hidden;
    }
    .satellite {
      position: absolute; font-size: 2rem; color: var(--accent);
      opacity: 0.8; animation: flySatellite linear infinite;
    }
    .satellite:nth-child(1) { top: 5%; animation-duration: 20s; font-size: 2.5rem; }
    .satellite:nth-child(2) { top: 25%; animation-duration: 25s; font-size: 2rem; }
    .satellite:nth-child(3) { top: 50%; animation-duration: 18s; font-size: 3rem; }
    .satellite:nth-child(4) { top: 70%; animation-duration: 22s; font-size: 1.8rem; }
    .satellite:nth-child(5) { top: 10%; animation-duration: 28s; font-size: 2.2rem; }
    .satellite:nth-child(6) { top: 40%; animation-duration: 15s; font-size: 1.9rem; }
    @keyframes flySatellite {
      0% { transform: translateX(-10vw) rotate(0deg); }
      100% { transform: translateX(110vw) rotate(360deg); }
    }
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      background: rgba(5, 18, 50, 0.55);
      backdrop-filter: blur(15px);
      border-radius: 2rem;
      padding: 0.8rem 1.2rem;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      position: relative;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .header-left { display: flex; flex-direction: column; align-items: flex-start; }
    .logo {
      font-weight: 700; font-size: 1.4rem;
      background: linear-gradient(135deg, #c2e2ff, #4da8da);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .header-subtitle { font-size: 0.7rem; color: var(--muted); }
    .menu-toggle {
      display: none; background: rgba(30, 60, 120, 0.7);
      border: 1px solid rgba(100, 160, 220, 0.6);
      color: #fff; font-size: 1.4rem; padding: 0.4rem 0.8rem;
      border-radius: 0.6rem; cursor: pointer;
    }
    nav { display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; }
    nav a {
      color: #fff; text-decoration: none; font-weight: 500;
      padding: 0.35rem 0.8rem; border-radius: 1.2rem;
      font-size: 0.85rem; display: inline-flex;
      align-items: center; gap: 0.3rem;
    }
    nav a i { color: var(--accent); }
    nav a:hover { background: rgba(77, 168, 218, 0.3); }
    nav a.active { background: var(--accent); color: #021024; }
    nav a.active i { color: #021024; }
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      nav {
        display: none; position: absolute; top: 100%; right: 0;
        flex-direction: column; gap: 0.5rem; padding: 1rem;
        background: rgba(3, 12, 38, 0.98);
        border-radius: 1rem; min-width: 240px;
        z-index: 1000; margin-top: 0.5rem;
      }
      nav.show { display: flex; }
      nav a { padding: 0.8rem 1.1rem; font-size: 1.05rem; background: rgba(15, 40, 90, 0.7); }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(100, 160, 220, 0.2);
      border-radius: 1.2rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(4px);
    }
    
    /* Комбобокс с стрелкой */
    .album-selector {
      position: relative;
      margin-bottom: 1rem;
      max-width: 400px;
    }
    .album-selector label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .album-selector select {
      width: 100%;
      padding: 0.7rem 2.5rem 0.7rem 1rem;
      border-radius: 0.8rem;
      background: rgba(15, 40, 90, 0.8);
      color: #fff;
      border: 1px solid var(--border);
      font-size: 1rem;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    .album-selector select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .album-selector select option {
      background: #0a1a4a;
      color: #fff;
      padding: 0.5rem;
    }
    /* Стрелка ▼ */
    .album-selector::after {
      content: '▼';
      position: absolute;
      right: 15px;
      bottom: 12px;
      color: var(--accent);
      pointer-events: none;
      font-size: 0.7rem;
    }
    
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.6rem;
    }
    .photo-item {
      background: rgba(13, 35, 80, 0.5);
      border-radius: 0.5rem; overflow: hidden;
      border: 1px solid #2a4a7a; cursor: pointer;
    }
    .photo-item img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .pagination {
      display: flex; flex-wrap: wrap; gap: 0.3rem;
      justify-content: center; margin-top: 1rem;
    }
    .page-btn {
      background: rgba(15, 40, 90, 0.6); color: #fff;
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem; border-radius: 0.5rem;
      cursor: pointer; font-size: 0.8rem;
    }
    .page-btn.active { background: var(--accent); color: #021024; }
    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      z-index: 5000; justify-content: center; align-items: center;
    }
    .modal img { max-width: 80%; max-height: 75%; border-radius: 0.5rem; }
    .modal-close { position: absolute; top: 15px; right: 25px; font-size: 2.5rem; color: #fff; cursor: pointer; }
    .modal-nav { position: absolute; top: 50%; font-size: 3rem; color: #fff; cursor: pointer; padding: 1rem; }
    .modal-prev { left: 15px; }
    .modal-next { right: 15px; }
    .slideshow-btn {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      background: rgba(77, 168, 218, 0.7); color: #fff;
      border: none; padding: 0.7rem 1.5rem; border-radius: 2rem;
      cursor: pointer;
    }
    .counter { position: absolute; top: 20px; left: 20px; color: #fff; }
    h1 { color: #fff; margin-bottom: 0.5rem; }
    footer {
      text-align: center; margin-top: 2rem; color: var(--muted);
      font-size: 0.85rem; border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    @media (max-width: 480px) {
      .gallery { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .photo-item img { height: 100px; }
    }
  </style>
</head>
<body>

<div class="satellite-container">
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
  <div class="satellite"><i class="fas fa-satellite"></i></div>
</div>

<div class="container">
  <header>
    <div class="header-left">
      <span class="logo"><i class="fas fa-satellite"></i> ФПК МИИГАиК · 1994</span>
      <span class="header-subtitle">Неофициальный сайт выпуска ФПК 1994</span>
    </div>
    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
    <nav id="navMenu">
            <a href="index.html"><i class="fas fa-users"></i> О нас</a>
      <a href="events.html"><i class="fas fa-calendar-alt"></i> Мероприятия</a>
      <a href="photos.html" class="active"><i class="fas fa-camera"></i> Фото</a>
      <a href="videos.html"><i class="fas fa-video"></i> Видео</a>
      <a href="screenshots.html"><i class="fas fa-desktop"></i> Обои</a>
      <a href="music.html"><i class="fas fa-music"></i> Музыка</a>

    </nav>
  </header>

  <main>
    <div class="card">
      <h1><i class="fas fa-camera-retro" style="color: var(--accent);"></i> Фотоальбомы</h1>
      <div class="album-selector">
        <label>Выберите альбом:</label>
        <select id="albumSelect" onchange="switchAlbum(this.value)"></select>
      </div>
      <div class="gallery" id="gallery"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
  
  <footer>© Выпускники ФПК МИИГАиК 1994 · Космос навсегда ·</footer>
</div>

<div class="modal" id="photoModal">
  <span class="modal-close" onclick="closeModal()">&times;</span>
  <span class="counter" id="counter"></span>
  <span class="modal-nav modal-prev" onclick="prevPhoto()">&#10094;</span>
  <img id="modalImage" src="" alt="Фото">
  <span class="modal-nav modal-next" onclick="nextPhoto()">&#10095;</span>
  <button class="slideshow-btn" id="slideshowBtn" onclick="toggleSlideshow()">▶ Слайд-шоу</button>
</div>

<script>
  const albums = [
        {
      name: 'Все',
      photos: [
        { src: 'https://i.ibb.co/pBstsVmr/2bdf01db-1b52-4287-9980-d7e77c7bba3c.jpg', caption: '//i.ibb.co/pBstsVmr/2bdf01db-1b52-4287-9980-d7e77c7bba3c.jpg' }
      ]
    }
    ,
    {
      name: '1',
      photos: [
        { src: 'https://i.ibb.co/pBstsVmr/2bdf01db-1b52-4287-9980-d7e77c7bba3c.jpg', caption: '//i.ibb.co/pBstsVmr/2bdf01db-1b52-4287-9980-d7e77c7bba3c.jpg' }
      ]
    }

  ];
  
  const photosPerPage = 20;
  let currentAlbum = 0;
  let currentPhotos = [];
  let currentPage = 1;
  let currentIndex = 0;
  let slideshowInterval = null;
  
  function createStars() {
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'twinkle-star';
      const size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(star);
    }
  }
  
  function buildSelect() {
    const select = document.getElementById('albumSelect');
    select.innerHTML = '';
    albums.forEach((album, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = album.name;
      select.appendChild(opt);
    });
  }
  
  function switchAlbum(index) {
    currentAlbum = parseInt(index);
    currentPage = 1;
    buildGallery();
  }
  
  function buildGallery() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    currentPhotos = albums[currentAlbum].photos;
    const start = (currentPage - 1) * photosPerPage;
    const end = Math.min(start + photosPerPage, currentPhotos.length);
    for (let i = start; i < end; i++) {
      const div = document.createElement('div');
      div.className = 'photo-item';
      div.innerHTML = `<img src="${currentPhotos[i].src}" loading="lazy">`;
      div.onclick = () => openModal(i);
      gallery.appendChild(div);
    }
    buildPagination();
  }
  
  function buildPagination() {
    const pag = document.getElementById('pagination');
    pag.innerHTML = '';
    const totalPages = Math.ceil(currentPhotos.length / photosPerPage);
    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = () => { currentPage = i; buildGallery(); };
      pag.appendChild(btn);
    }
  }
  
  const modal = document.getElementById('photoModal');
  const modalImage = document.getElementById('modalImage');
  const counter = document.getElementById('counter');
  const slideshowBtn = document.getElementById('slideshowBtn');
  
  function openModal(index) {
    currentIndex = index;
    updateModal();
    modal.style.display = 'flex';
  }
  function closeModal() { modal.style.display = 'none'; stopSlideshow(); }
  function updateModal() {
    modalImage.src = currentPhotos[currentIndex].src;
    counter.textContent = (currentIndex + 1) + ' / ' + currentPhotos.length;
  }
  function nextPhoto() { currentIndex = (currentIndex + 1) % currentPhotos.length; updateModal(); }
  function prevPhoto() { currentIndex = (currentIndex - 1 + currentPhotos.length) % currentPhotos.length; updateModal(); }
  function toggleSlideshow() {
    if (slideshowInterval) stopSlideshow();
    else startSlideshow();
  }
  function startSlideshow() {
    slideshowInterval = setInterval(nextPhoto, 2000);
    slideshowBtn.textContent = '⏸ Пауза';
  }
  function stopSlideshow() {
    if (slideshowInterval) { clearInterval(slideshowInterval); slideshowInterval = null; }
    slideshowBtn.textContent = '▶ Слайд-шоу';
  }
  
  const toggle = document.getElementById('menuToggle');
  const nav = document.getElementById('navMenu');
  if (toggle && nav) {
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      nav.classList.toggle('show');
    });
  }
  
  buildSelect();
  buildGallery();
  createStars();
</script>
</body>
</html>
